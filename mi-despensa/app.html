<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Despensa</title><style>
:root{color-scheme:dark;--bg:#1a0f2e;--panel:#2a1a3e;--purple:#6b2c91;--gold:#d4af37;--muted:#b8abc5}*{box-sizing:border-box}body{margin:0;padding:24px;font-family:system-ui,Segoe UI,sans-serif;background:linear-gradient(135deg,#1a0f2e,#3d1a5c,#2a1a3e);color:#f7f3fa}main{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1,h2{color:var(--gold)}.panel,.item{background:rgba(42,26,62,.95);border:1px solid var(--purple);border-radius:12px;padding:18px;margin:16px 0}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #76508e;background:#21152f;color:white}button{cursor:pointer;background:#5d267d}button:hover{filter:brightness(1.2)}.secondary{background:transparent;border-color:var(--gold);color:var(--gold)}.danger{background:#852f4c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--gold)}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{margin:0}.item h3{margin:0 0 8px}.muted{color:var(--muted);font-size:.9rem}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{padding:7px 10px}.hidden{display:none!important}a{color:var(--gold)}@media(max-width:600px){body{padding:12px}.panel{padding:13px}}
</style></head><body><main><header><div><h1>🏠 Mi Despensa</h1><p class="muted">Organiza tu inventario, favoritos y compras</p></div><a href="index.html">← Inicio</a></header>
<section class="panel"><h2>Agregar artículo</h2><form id="add" class="form"><input id="name" placeholder="Nombre del artículo" required maxlength="80"><select id="category"><option>Alimentos</option><option>Bebidas</option><option>Despensa</option><option>Congelados</option><option>Productos de Limpieza</option><option>Artículos de Aseo</option><option>Especias</option><option>Otros</option></select><input id="qty" type="number" min="0" step=".01" value="1" required><select id="unit"><option>uds</option><option>kg</option><option>g</option><option>L</option><option>ml</option><option>packs</option><option>cajas</option><option>botellas</option><option>bolsas</option></select><input id="image" type="url" placeholder="URL de imagen (opcional)"><button>＋ Añadir</button></form></section>
<section class="panel"><div class="stats"><span id="count">0 artículos</span><span id="low">0 sin stock</span><span id="boughtCount">0 comprados</span></div><div class="toolbar"><input id="search" placeholder="Buscar artículo..." style="flex:1;min-width:180px"><select id="filter"><option value="all">Todo el inventario</option><option value="fav">Favoritos</option><option value="low">Sin stock</option><option value="bought">Comprados</option></select><button class="secondary" id="export">Exportar copia</button><button class="secondary" id="importBtn">Importar</button><input id="file" type="file" accept="application/json" class="hidden"></div><div id="items" class="items"></div></section><p class="muted">Los datos se guardan en este navegador mediante almacenamiento local. No hay sincronización en la nube. Exporta copias de seguridad periódicamente.</p></main>
<script>
(()=>{'use strict';const KEY='despensaItems';let items=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('No se pudo guardar. Comprueba el espacio disponible del navegador.')}}function load(){try{const raw=localStorage.getItem(KEY);items=raw?JSON.parse(raw):[];if(!Array.isArray(items))items=[];items=items.map((x,i)=>({...x,id:x.id||String(i)+'-'+Date.now(),unit:x.unit||'uds',favorite:!!x.favorite,bought:!!x.bought,quantity:Number(x.quantity)||0}))}catch(e){items=[]}}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const shown=items.filter(x=>(!q||(x.name+' '+x.category).toLowerCase().includes(q))&&(f==='all'||(f==='fav'&&x.favorite)||(f==='low'&&!x.bought&&x.quantity<=0)||(f==='bought'&&x.bought)));$('count').textContent=items.filter(x=>!x.bought).length+' artículos';$('low').textContent=items.filter(x=>!x.bought&&x.quantity<=0).length+' sin stock';$('boughtCount').textContent=items.filter(x=>x.bought).length+' comprados';$('items').innerHTML=shown.length?shown.map(x=>'<article class="item"><h3>'+esc(x.favorite?'★ ':'')+esc(x.name)+'</h3><div class="muted">'+esc(x.category)+' · '+(x.bought?'Comprado':esc(x.quantity)+' '+esc(x.unit))+'</div>'+(x.image&&/^https?:\/\//i.test(x.image)?'<p><img src="'+esc(x.image)+'" alt="" style="max-width:100%;max-height:120px;border-radius:8px"></p>':'')+'<div class="actions">'+(x.bought?'<button data-act="restore" data-id="'+esc(x.id)+'">Restaurar</button>':'<button data-act="minus" data-id="'+esc(x.id)+'">−</button><button data-act="plus" data-id="'+esc(x.id)+'">＋</button><button data-act="buy" data-id="'+esc(x.id)+'">Comprado</button>')+'<button class="secondary" data-act="fav" data-id="'+esc(x.id)+'">'+(x.favorite?'Quitar favorito':'★ Favorito')+'</button><button class="danger" data-act="del" data-id="'+esc(x.id)+'">Eliminar</button></div></article>').join(''):'<p class="muted">No hay artículos en esta vista.</p>'}function add(e){e.preventDefault();const name=$('name').value.trim(),quantity=Number($('qty').value);if(!name||!Number.isFinite(quantity)||quantity<0)return;items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,category:$('category').value,quantity,unit:$('unit').value,image:$('image').value.trim(),favorite:false,bought:false});save();$('add').reset();$('qty').value=1;render()}$('add').addEventListener('submit',add);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('items').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const x=items.find(i=>i.id===b.dataset.id);if(!x)return;switch(b.dataset.act){case'plus':x.quantity=Math.round((x.quantity+1)*100)/100;break;case'minus':x.quantity=Math.max(0,Math.round((x.quantity-1)*100)/100);break;case'buy':x.bought=true;break;case'restore':x.bought=false;break;case'fav':x.favorite=!x.favorite;break;case'del':if(!confirm('¿Eliminar este artículo?'))return;items=items.filter(i=>i.id!==x.id);break}save();render()});$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Mi Despensa',schemaVersion:2,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-despensa-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),list=Array.isArray(data)?data:data.items;if(!Array.isArray(list))throw Error();if(!confirm('La importación reemplazará el inventario actual. ¿Continuar?'))return;items=list.map((x,i)=>({...x,id:String(x.id||Date.now()+'-'+i),name:String(x.name||'Artículo'),quantity:Math.max(0,Number(x.quantity)||0),unit:x.unit||'uds',favorite:!!x.favorite,bought:!!x.bought}));save();render();alert('Copia importada correctamente')}catch(err){alert('El archivo no contiene una copia válida de Mi Despensa')}finally{e.target.value=''}};window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});load();if(!items.length&&!localStorage.getItem(KEY)){items=[{id:'demo-1',name:'Arroz',category:'Alimentos',quantity:1,unit:'kg',favorite:true,bought:false},{id:'demo-2',name:'Leche',category:'Bebidas',quantity:2,unit:'L',favorite:false,bought:false}];save()}render()})();
</script></body></html>
