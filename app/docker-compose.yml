services:
  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PROJECT_ROOT: /app
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in app/.env}
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in app/.env}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:?Set ADZUNA_APP_ID in app/.env}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:?Set ADZUNA_APP_KEY in app/.env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in app/.env}
      POSTGRES_DB: ${POSTGRES_DB:-swiss}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: swiss_pgdata
